/* Global typography: applies to every view, including dynamically created dialogs. */

function roomTabs(type){const arr=data[type],names=[...new Set([...rooms.map(r=>r[0]),...arr.map(x=>x.room).filter(Boolean)])].filter(r=>arr.some(x=>x.room===r));return `<div class="room-filter-tabs" role="group" aria-label="סינון לפי חדר">${roomTab('הכל',arr.length,filterRoom==='הכל',`setRoomFilter('${type}','הכל')`)}${[...floors.map(f=>f.name),'אזורים נוספים'].map(floor=>{const list=names.filter(r=>floorOf(r)===floor);return list.length?`<span class="room-filter-floor-label">${floor}</span>${list.map(r=>roomTab(r,arr.filter(x=>x.room===r).length,filterRoom===r,`setRoomFilter('${type}',decodeURIComponent('${encodeURIComponent(r)}'))`)).join('')}`:''}).join('')}</div>`}

function filters(type){
 const roomNames=[...new Set([...rooms.map(r=>r[0]),...data[type].map(x=>x.room).filter(Boolean)])];
 const selected=roomNames.includes(filterRoom)?filterRoom:'הכל';

function purchaseFilters(){let all=[...new Set([...rooms.map(r=>r[0]),...data.purchases.map(x=>x.room)])];return `<div class="purchase-toolbar noprint"><div class="purchase-toolbar-title">סינון לפי חדר</div><div class="purchase-tabs" role="group" aria-label="סינון רכישות לפי חדר"><button class="purchase-tab ${filterRoom==='הכל'?'active':''}" aria-pressed="${filterRoom==='הכל'}" onclick="setPurchaseRoom('הכל')">כל החדרים <span class="count">${data.purchases.length}</span></button>${all.map(r=>`<button class="purchase-tab ${filterRoom===r?'active':''}" aria-pressed="${filterRoom===r}" onclick="setPurchaseRoom(decodeURIComponent('${encodeURIComponent(r)}'))">${esc(r)} <span class="count">${data.purchases.filter(x=>x.room===r).length}</span></button>`).join('')}</div><div class="purchase-controls"><div class="purchase-search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" aria-label="חיפוש רכישות" placeholder="חיפוש רהיטים, מוצרים או קטגוריות..." value="${esc(search)}" oninput="search=this.value;updateRows('purchases')"></div><select class="purchase-select" aria-label="סינון לפי סטטוס" onchange="purchaseStatus=this.value;updateRows('purchases')"><option value="הכל" ${purchaseStatus==='הכל'?'selected':''}>כל הסטטוסים</option>${['לבדיקה','אושר','בביצוע','הושלם','בוטל'].map(v=>`<option ${purchaseStatus===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="purchase-kpis" id="purchaseKpis"></div></div><div class="purchase-results"><strong id="purchaseResultsTitle">רשימת רכישות</strong><span id="purchaseResultsCount"></span></div>`}
function setPurchaseRoom(room){filterRoom=room;let tabs=document.querySelectorAll('.purchase-tab');tabs.forEach(b=>{let active=b.textContent.trim().replace(/\s+\d+$/,'')===(room==='הכל'?'כל החדרים':room);b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});updateRows('purchases')}
function listing(type){let purchase=type==='purchases';return header(purchase?'רכישות ורהיטים':'עבודות שיפוץ',purchase?'כל הרהיטים והמוצרים לבית — מחולקים לטבלאות לפי חדר.':'כל חדר או אזור בטבלה משלו, כדי שיהיה קל לסרוק ולתמחר.',`<button class="btn primary" onclick="openEditor('${type}')">+ ${purchase?'הוספת רכישה':'הוספת עבודה'}</button>${purchase?'':`<button class="btn" onclick="go('woodwork')">תצוגת נגרות ←</button>`}`)+listFilters(type)+`<div id="groupedTables" class="grouped-tables"></div><p class="hint">לחיצה על שורה פותחת עריכה מלאה. אפשר לשנות עדיפות וסטטוס ישירות בטבלה, ולגרור שורות באותה רמת עדיפות באמצעות הידית שמופיעה במעבר עכבר — בתוך אותה טבלה בלבד.</p>`}

function groupedRow(type,x){return `<tr class="editable-row reorder-row" data-row-id="${esc(x.id)}" tabindex="0" role="button" aria-label="עריכת ${esc(x.name)}" onclick="openEditor('${type}','${x.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openEditor('${type}','${x.id}')}"><td><b>${esc(x.name)}</b>${x.notes?`<div class="mini">${esc(x.notes)}</div>`:''}</td><td>${esc(x.category)}</td><td>${inlineSelect(type,x,"priority",PRIORITY_OPTIONS)}</td><td>${inlineSelect(type,x,"status",["לבדיקה","אושר","בביצוע","הושלם","בוטל"])}</td>${type==='purchases'?`<td class="quantity-cell"><span class="quantity-inline">${inlineNumber(type,x,"quantity")}<span class="quantity-unit">${esc(x.unit||"יח׳")}</span></span></td>`:''}<td class="money-cell">${x.quantity&&x.unitPrice?money(x.quantity*x.unitPrice):'<span class="unpriced-pill">לא תומחר</span>'}</td><td class="action-col"><div class="row-actions-with-drag">${rowActionButtons(type,x.id)}<button type="button" class="drag-handle" draggable="true" aria-label="שינוי סדר השורה" title="גרירה לשינוי סדר" onmousedown="event.stopPropagation()" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="5" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="19" r="1"/></svg></button></div></td></tr>`}
function groupedTable(type,room,items){items=byPriority(items);const purchase=type==='purchases';const total=items.reduce((a,x)=>a+(Number(x.quantity)||0)*(Number(x.unitPrice)||0),0);return `<section class="room-table-section"><div class="room-table-heading"><div class="room-table-title"><span class="room-table-emoji">${rooms.find(r=>r[0]===room)?.[1]||'🏠'}</span><div><h2>${esc(room)}</h2><span>${items.length} ${purchase?'פריטים':'עבודות'}</span></div></div><div class="room-table-actions"><span class="room-table-total">${total?money(total):'<span class="unpriced-pill">טרם תומחר</span>'}</span><button class="room-add-btn" onclick="openEditor('${type}',null,'${esc(room)}')" title="הוספת סעיף לחדר">+ הוספה</button></div></div><div class="tablewrap polished-table room-table-wrap"><table class="data-table ${purchase?'purchase-table':'works-table'}"><colgroup><col style="width:36%"><col style="width:17%"><col style="width:13%"><col style="width:13%">${purchase?'<col style="width:9%">':''}<col style="width:12%"><col style="width:126px"></colgroup><thead><tr><th>סעיף</th><th>קטגוריה</th><th>עדיפות</th><th>סטטוס</th>${purchase?'<th>כמות</th>':''}<th>עלות כוללת</th><th class="action-col" aria-label="עריכה"></th></tr></thead><tbody data-reorder-type="${type}" data-reorder-group="${esc(room)}">${items.map(x=>groupedRow(type,x)).join('')}</tbody></table></div></section>`}

function inlineSelect(type,x,key,options){const tone=key==='priority'?'priority-'+(x[key]||'unknown'):'status-'+(x[key]||'unknown');return `<select class="inline-control inline-${key} ${tone}" aria-label="${key==='priority'?'עדיפות':'סטטוס'}" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()" onchange="inlineUpdate('${type}','${x.id}','${key}',this.value);this.className='inline-control inline-${key} '+('${key}'==='priority'?'priority-':'status-')+this.value">${options.map(o=>`<option value="${o}" ${x[key]===o?'selected':''}>${o}</option>`).join('')}</select>`}
function inlineNumber(type,x,key){return `<input class="inline-control inline-number" type="number" min="0" step="any" aria-label="כמות" value="${esc(x[key]??'')}" placeholder="—" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()" onchange="inlineUpdate('${type}','${x.id}','${key}',this.value)">`}
function inlineUpdate(type,id,key,value){const item=data[type]?.find(x=>x.id===id);if(!item)return;if(key==='quantity'&&value!==''&&(!Number.isFinite(Number(value))||Number(value)<0)){alert('יש להזין כמות תקינה');render();return}item[key]=value;save();showToast('השדה עודכן')}
function updateRows(type){let arr=data[type].filter(x=>(filterRoom==='הכל'||x.room===filterRoom)&&(`${x.room} ${x.name} ${x.category} ${x.notes||''}`).toLocaleLowerCase('he').includes(search.toLocaleLowerCase('he'))&&(purchaseStatus==='הכל'||x.status===purchaseStatus)&&(priorityFilter==='הכל'||x.priority===priorityFilter));{const count=$('#workFilterCount');if(count)count.textContent=`מוצגים ${arr.length} מתוך ${data[type].length} סעיפים`;}if(type==='purchases'){let total=arr.reduce((a,x)=>a+(Number(x.quantity)||0)*(Number(x.unitPrice)||0),0),priced=arr.filter(x=>x.quantity&&x.unitPrice).length;const title=$('#purchaseResultsTitle'),count=$('#purchaseResultsCount'),kpis=$('#purchaseKpis');if(title)title.textContent=filterRoom==='הכל'?'כל הרכישות':`רכישות · ${filterRoom}`;if(count)count.textContent=`${arr.length} פריטים`;if(kpis)kpis.innerHTML=`<div class='purchase-kpi'><div class='value'>${arr.length}</div><div class='label'>פריטים בתצוגה</div></div><div class='purchase-kpi'><div class='value'>${priced} / ${arr.length}</div><div class='label'>פריטים מתומחרים</div></div><div class='purchase-kpi'><div class='value'>${money(total)}</div><div class='label'>סכום מתומחר</div></div>`;}const root=$('#groupedTables');if(!root)return;const ordered=[...rooms.map(r=>r[0]),...new Set(arr.map(x=>x.room).filter(r=>!rooms.some(x=>x[0]===r)))];root.innerHTML=[...floors.map(f=>f.name),'אזורים נוספים'].map(floor=>{const matched=ordered.filter(room=>floorOf(room)===floor&&arr.some(x=>x.room===room));if(!matched.length)return '';return `<section class="floor-table-group"><div class="floor-heading"><span class="floor-symbol">${floor==='קומה תחתונה'?'<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16m-6-6 6 6 6-6"/></svg>':floor==='קומה עליונה'?'<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V4m-6 6 6-6 6 6"/></svg>':'<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16m-4-4 4 4 4-4M17 20V4m-4 4 4-4 4 4"/></svg>'}</span><div><h2>${floor}</h2><p>${matched.length} חללים · ${matched.reduce((n,r)=>n+arr.filter(x=>x.room===r).length,0)} סעיפים</p></div></div>${matched.map(room=>groupedTable(type,room,arr.filter(x=>x.room===room))).join('')}</section>`}).join('')||`<div class="panel empty">לא נמצאו סעיפים המתאימים לסינון</div>`}

/* Schematic architectural layer: illustrative fixtures and openings, not surveyed geometry. */
function virtualRoomDetails(x,y,w,h,key){
 const box=(rx,ry,rw,rh,kind='furniture')=>'<rect class="v-detail v-'+kind+'" x="'+(x+rx*w)+'" y="'+(y+ry*h)+'" width="'+(rw*w)+'" height="'+(rh*h)+'" rx="4"/>';
 const line=(x1,y1,x2,y2,kind='fixture')=>'<line class="v-'+kind+'" x1="'+(x+x1*w)+'" y1="'+(y+y1*h)+'" x2="'+(x+x2*w)+'" y2="'+(y+y2*h)+'"/>';
 const circle=(cx,cy,rad,kind='furniture')=>'<circle class="v-detail v-'+kind+'" cx="'+(x+cx*w)+'" cy="'+(y+cy*h)+'" r="'+Math.min(w,h)*rad+'"/>';
 let f='';
 if(['parents','bedroom2','bedroom3','bedroom4'].includes(key)){
  f+=box(.12,.24,.35,.39,'bed')+box(.15,.29,.29,.12,'pillow')+box(.52,.24,.12,.13)+box(.12,.72,.32,.1,'cabinet');
 }else if(key==='living'){
  f+=box(.1,.21,.34,.14,'sofa')+box(.1,.35,.1,.25,'sofa')+box(.32,.47,.22,.13,'table')+box(.77,.22,.06,.43,'cabinet')+circle(.65,.67,.09,'rug');
 }else if(key==='kitchen'){
  f+=box(.08,.12,.22,.72,'counter')+box(.32,.12,.5,.13,'counter')+box(.45,.49,.34,.19,'island')+circle(.18,.24,.045,'sink');
 }else if(key==='dining'){
  f+=box(.27,.32,.47,.32,'table')+box(.34,.22,.13,.08,'chair')+box(.53,.22,.13,.08,'chair')+box(.34,.66,.13,.08,'chair')+box(.53,.66,.13,.08,'chair');
 }else if(key==='storage'){
  f+=box(.08,.17,.17,.66,'cabinet')+box(.73,.17,.17,.66,'cabinet')+box(.31,.19,.33,.12,'cabinet');
 }else if(key==='stairs'){
  for(let n=0;n<7;n++)f+=line(.12,.16+n*.095,.83,.16+n*.095,'stair');
 }else if(['wc','bath','bathparents'].includes(key)){
  f+=box(.08,.16,.36,.27,'shower')+box(.56,.2,.23,.19,'sink')+circle(.66,.7,.11,'toilet');
 }else if(key==='closet'){
  f+=box(.08,.15,.24,.7,'cabinet')+box(.68,.15,.24,.7,'cabinet');
 }else if(key==='entrance'){
  f+=box(.12,.2,.22,.55,'cabinet');
 }
 if(virtualRenovationMode==='after'){
  if(key==='kitchen')f=box(.08,.12,.22,.72,'counter')+box(.32,.12,.5,.13,'counter')+box(.48,.44,.32,.22,'island')+box(.30,.49,.15,.12,'table')+circle(.18,.24,.045,'sink');
  if(key==='storage')f=box(.06,.08,.18,.84,'cabinet')+box(.76,.08,.18,.84,'cabinet')+box(.30,.08,.4,.14,'cabinet');
  if(['wc','bath','bathparents'].includes(key))f=box(.07,.1,.4,.37,'shower')+box(.55,.17,.3,.17,'sink')+circle(.67,.72,.1,'toilet');
 }
 // Openings are deliberately illustrative until verified against architectural plans.
 const windows=['living','kitchen','parents','bedroom2','bedroom3','bedroom4','dining'];
 const opening=windows.includes(key)?line(.32,0,.68,0,'window'):'';
 const door=line(.72,1,.91,1,'door');
 return '<g class="v-room-details" aria-hidden="true">'+f+opening+door+'</g>';
}

function openEditor(type,id=null,room=''){let item=id?data[type].find(x=>x.id===id):null;let x=item||{room:room||rooms[0][0],name:'',category:'',priority:'רצוי',status:type==='decisions'?'פתוח':'לבדיקה',quantity:1,unit:'יח׳',unitPrice:'',notes:'',supplier:'לא נקבע',url:''};let field=(key,label,kind='text',opts=null)=>`<label class="field ${key==='name'||key==='notes'||key==='url'?'wide':''}"><span>${label}</span>${opts?`<select name="${key}">${opts.map(o=>`<option ${x[key]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:kind==='textarea'?`<textarea name="${key}" rows="3">${esc(x[key])}</textarea>`:`<input type="${kind}" name="${key}" value="${esc(x[key])}" ${key==='name'?'required':''}>`}</label>`;let html=`<div class="modalshade" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${item?'עריכת סעיף':'הוספת סעיף חדש'}</h2><form id="editForm" onsubmit="submitEdit(event,'${type}','${id||''}')"><div class="formgrid">${field('room','חדר','text',['כללי',...rooms.map(r=>r[0])])}${field('name','תיאור הסעיף')}${type==='decisions'?field('status','סטטוס','text',['פתוח','ממתין','הושלם']):field('category','קטגוריה')+field('priority','עדיפות','text',PRIORITY_OPTIONS)+field('status','סטטוס','text',['לבדיקה','אושר','בביצוע','הושלם','בוטל'])+field('quantity','כמות','number')+field('unit','יחידה','text',['יח׳','מ״ר','מ״א','קומפלט','שעה'])+field('unitPrice','מחיר ליחידה (₪)','number')+field('supplier','אחריות אספקה','text',['לא נקבע','קבלן','רכישה עצמאית','נגר','ספק אחר'])}${field('notes','הערות','textarea')}${type==='purchases'?field('url','קישור למוצר'):''}</div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">ביטול</button>${item?`<button type="button" class="btn" onclick="removeItem('${type}','${id}')">מחיקה</button>`:''}<button type="submit" class="btn primary">שמירה</button></div></form></div></div>`;$('#modalRoot').innerHTML=html}

function submitEdit(e,type,id){e.preventDefault();let obj=Object.fromEntries(new FormData(e.target).entries());if(!obj.name.trim())return;obj.id=id||type[0]+Date.now();if(id){let i=data[type].findIndex(x=>x.id===id);data[type][i]=obj}else data[type].push(obj);closeModal();save();showToast(id?'השינויים נשמרו':'הסעיף נוסף')}function removeItem(type,id){requestDelete(type,id)}

let dbPromise;
function dbOpen(){if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open('renovationInspirationDB',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('items'))req.result.createObjectStore('items',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return dbPromise}
async function dbAll(){const db=await dbOpen();return new Promise((resolve,reject)=>{const req=db.transaction('items','readonly').objectStore('items').getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function dbPut(item){const db=await dbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction('items','readwrite');tx.objectStore('items').put(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function dbDelete(id){const db=await dbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction('items','readwrite');tx.objectStore('items').delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function inspoPage(){return mediaPage('inspo')}

function mediaPage(kind){const isRender=kind==='renders';const label=isRender?'הדמיות':'השראות';return header('ספריית '+label,isRender?'ההדמיות של הבית אחרי השיפוץ, מסודרות לפי חדר.':'כל הרעיונות, התמונות והקישורים לבית החדש — במקום אחד.',`<button class="btn" onclick="exportData()">↓ גיבוי מלא</button><button class="btn primary" onclick="openBatchUploader('${kind}')">+ הוספת ${isRender?'הדמיות':'השראות'}</button>`)+`<div class="inspo-toolbar"><label class="filter-search"><span>⌕</span><input placeholder="חיפוש בהערות ובקישורים..." oninput="mediaSearch=this.value;renderInspoCards(false,'${kind}')"></label><select id="inspoFilter" onchange="mediaRoom=this.value;renderInspoCards(false,'${kind}')" class="btn"><option value="הכל">כל החדרים</option>${rooms.map(r=>`<option>${esc(r[0])}</option>`).join('')}</select><button class="btn" onclick="document.getElementById('backupFile').click()">↑ שחזור מגיבוי</button><input id="backupFile" type="file" accept=".json,application/json" style="display:none" onchange="importBackup(this)"></div><div class="inspo-grid media-rails" id="inspoCards"></div><section class="media-upload-footer"><div class="dropzone" id="pageDrop" onclick="document.getElementById('multiFile').click()" ondragover="dragOverMedia(event)" ondragleave="dragLeaveMedia(event)" ondrop="dropMedia(event,'${kind}')"><strong>גררו לכאן תמונות מהמחשב</strong><small>אפשר להעלות כמה תמונות ביחד · JPG, PNG, WebP · או ללחוץ לבחירת קבצים</small><input id="multiFile" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden onchange="openBatchUploader('${kind}',this.files)"></div><div class="backup-warning">התמונות נשמרות בדפדפן במחשב הזה — לא בתוך קובץ ה-HTML. כדי שלא תאבדו אותן, הורידו מדי פעם גיבוי מלא ושמרו אותו במקום נוסף. מעבר לדפדפן או מחשב אחר דורש ייבוא גיבוי.</div></section>`}
function cardMarkup(x){let picture=x.image?`<img src="${x.image}" alt="${esc(x.title)}" loading="lazy">`:x.url&&/^https?:\/\//i.test(x.url)&&/\.(png|jpe?g|webp|gif)(\?|$)/i.test(x.url)?`<img src="${esc(x.url)}" alt="${esc(x.title)}" loading="lazy" onerror="this.style.display='none'">`:'✦';return `<article class="inspo-card" data-media-id="${esc(x.id)}" data-media-kind="${esc(x.kind||'inspo')}" data-media-notes="${esc(x.notes||'')}" data-media-url="${esc(x.url||'')}"><div class="inspo-cover" role="button" tabindex="0" aria-label="הגדלת תמונה" onclick="openMediaGallery(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openMediaGallery(this)}">${picture}<span class="gallery-hint">⤢ הגדלה</span></div><div class="inspo-body"><div class="inspo-card-topline"><span class="inspo-label" style="display:none">${esc(x.room)}</span><button class="media-edit-icon" title="עריכה" aria-label="עריכת תמונה" onclick="openMediaGalleryEditor(this)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L9 17l-4 1 1-4z"/></svg></button></div>${x.title?`<h3 style="margin-top:12px">${esc(x.title)}</h3>`:``}${x.notes?`<p>${esc(x.notes)}</p>`:''}<div class="inspo-actions">${x.url&&/^https?:\/\//i.test(x.url)?`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">פתיחת מקור ↗</a>`:'<span></span>'}</div></div></article>`}
function mediaRailOrder(arr){
 const ordered=[...floors.flatMap(f=>f.rooms),...rooms.map(r=>r[0])];
 return [...new Set([...ordered,...arr.map(x=>x.room)])].filter(room=>arr.some(x=>x.room===room));
}
function mediaRailMarkup(room,items,kind){

function scrollMediaRail(button,direction){

function mediaLoadingSkeleton(roomOnly=false){

 if(roomOnly)return '<div class="media-skeleton-inline">'+Array.from({length:3},card).join('')+'</div>';
 return '<div class="media-skeleton-rails" role="status" aria-label="טוען תמונות">'+Array.from({length:3},()=>'<section class="media-skeleton-rail"><div class="media-skeleton-heading sk-shimmer"></div><div class="media-skeleton-track">'+Array.from({length:4},card).join('')+'</div></section>').join('')+'</div>';

async function renderInspoCards(roomOnly=false,kind="inspo"){
 const target=document.getElementById(roomOnly?(kind==='renders'?'roomRenders':'roomInspo'):'inspoCards');
 if(!target)return;
 const loadingToken=String(Date.now())+Math.random();target.dataset.loadingToken=loadingToken;
 target.innerHTML=mediaLoadingSkeleton(roomOnly);
 try{
  const arr=(await dbAll()).filter(x=>(x.kind||'inspo')===kind).filter(x=>roomOnly?x.room===selectedRoom:(mediaRoom==='הכל'||x.room===mediaRoom)&&(`${x.notes||''} ${x.url||''} ${x.room||''}`).toLocaleLowerCase('he').includes(mediaSearch.toLocaleLowerCase('he')));
  if(!target.isConnected||target.dataset.loadingToken!==loadingToken)return;
  if(!arr.length){target.innerHTML=`<div class="inspo-empty">עדיין אין פריטים כאן.<br><br><button class="btn primary" onclick="openBatchUploader('${kind}')">+ הוספת פריט ראשון</button></div>`;return}
  if(roomOnly){target.innerHTML=arr.slice().reverse().map(cardMarkup).join('');return}
  target.classList.add('media-rails');
  const ordered=mediaRailOrder(arr);
  target.innerHTML=ordered.map(room=>mediaRailMarkup(room,arr.filter(x=>x.room===room).reverse(),kind)).join('');
 }catch(e){if(target.isConnected&&target.dataset.loadingToken===loadingToken)target.innerHTML='<div class="inspo-empty">לא ניתן לטעון את התמונות כרגע. נסו לרענן את העמוד.</div>'}
}

let mediaGalleryItems=[],mediaGalleryIndex=0,mediaGalleryPreviousFocus=null;
function openMediaGallery(cover){
 const covers=Array.from(cover.closest('.inspo-card').parentElement.querySelectorAll('.inspo-card .inspo-cover')).filter(el=>el.querySelector('img'));
 mediaGalleryItems=covers.map(el=>({src:el.querySelector('img').src,alt:el.querySelector('img').alt||'תמונה',room:el.closest('.inspo-card').querySelector('.inspo-label')?.textContent||''}));
 mediaGalleryIndex=covers.indexOf(cover);if(mediaGalleryIndex<0)return;
 mediaGalleryPreviousFocus=document.activeElement;
 if(!document.getElementById('mediaLightbox')){const layer=document.createElement('div');layer.id='mediaLightbox';layer.className='media-lightbox';layer.setAttribute('role','dialog');layer.setAttribute('aria-modal','true');layer.setAttribute('aria-label','גלריית תמונות');layer.innerHTML='<button class="lightbox-close" aria-label="סגירה" onclick="closeMediaGallery()">×</button><button class="lightbox-arrow" aria-label="תמונה קודמת" onclick="moveMediaGallery(-1)">❮</button><figure class="lightbox-figure"><img id="lightboxImage" alt=""><figcaption id="lightboxCaption"></figcaption></figure><button class="lightbox-arrow" aria-label="תמונה הבאה" onclick="moveMediaGallery(1)">❯</button>';layer.addEventListener('click',e=>{if(e.target===layer)closeMediaGallery()});document.body.appendChild(layer)}
 document.getElementById('mediaLightbox').style.display='flex';document.body.classList.add('lightbox-open');updateMediaGallery();document.querySelector('.lightbox-close').focus();
}
function updateMediaGallery(){const item=mediaGalleryItems[mediaGalleryIndex];if(!item)return;const img=document.getElementById('lightboxImage');img.src=item.src;img.alt=item.alt;document.getElementById('lightboxCaption').textContent=item.room+' · '+(mediaGalleryIndex+1)+' / '+mediaGalleryItems.length;document.querySelectorAll('.lightbox-arrow').forEach(b=>b.hidden=mediaGalleryItems.length<2)}
function moveMediaGallery(delta){if(!mediaGalleryItems.length)return;mediaGalleryIndex=(mediaGalleryIndex+delta+mediaGalleryItems.length)%mediaGalleryItems.length;updateMediaGallery()}
function closeMediaGallery(){const el=document.getElementById('mediaLightbox');if(el)el.style.display='none';document.body.classList.remove('lightbox-open');if(mediaGalleryPreviousFocus)mediaGalleryPreviousFocus.focus()}
let batchFiles=[];
function dragOverMedia(e){e.preventDefault();e.stopPropagation();e.currentTarget.classList.add('dragging')}
function dragLeaveMedia(e){e.preventDefault();e.currentTarget.classList.remove('dragging')}
function dropMedia(e,kind){e.preventDefault();e.stopPropagation();e.currentTarget.classList.remove('dragging');openBatchUploader(kind,e.dataTransfer.files)}
function readMediaFile(file){return new Promise((resolve,reject)=>{if(!['image/jpeg','image/png','image/webp'].includes(file.type))return reject(Error('סוג קובץ לא נתמך: '+file.name));if(file.size>8*1024*1024)return reject(Error('התמונה גדולה מ-8MB: '+file.name));const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('קריאת הקובץ נכשלה'));reader.readAsDataURL(file)})}
async function openBatchUploader(kind='inspo',files){batchFiles=[];document.getElementById('modalRoot').innerHTML=`<div class="modalshade" onclick="if(event.target===this)closeModal()"><div class="modal wide-modal"><h2>הוספת ${kind==='renders'?'הדמיות':'השראות'}</h2><p class="hint">בחרו כמה תמונות ביחד, הגדירו חדר משותף ואפשר גם לערוך הערה לכל תמונה לפני השמירה.</p><label class="field">חדר לכל התמונות<select id="batchRoom">${rooms.map(r=>`<option ${r[0]===selectedRoom?'selected':''}>${esc(r[0])}</option>`).join('')}</select></label><div class="dropzone" id="modalDrop" onclick="document.getElementById('batchPicker').click()" ondragover="dragOverMedia(event)" ondragleave="dragLeaveMedia(event)" ondrop="dropBatch(event)"><strong>גררו לכאן כמה תמונות או לחצו לבחירה</strong><small>עד 8MB לכל תמונה · ניתן להוסיף קבצים בכמה פעמים</small><input type="file" id="batchPicker" multiple accept="image/jpeg,image/png,image/webp" hidden onchange="appendBatchFiles(this.files);this.value=''" /></div><div class="batch-status" id="batchStatus"></div><div class="batch-grid" id="batchGrid"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">ביטול</button><button class="btn primary" id="batchSave" onclick="saveBatch('${kind}')" disabled>שמירת כל התמונות</button></div></div></div>`;if(files?.length)await appendBatchFiles(files)}
function dropBatch(e){e.preventDefault();e.stopPropagation();e.currentTarget.classList.remove('dragging');appendBatchFiles(e.dataTransfer.files)}
async function appendBatchFiles(files){let errors=[];for(const f of Array.from(files)){try{batchFiles.push({image:await readMediaFile(f),name:f.name,notes:'',url:''})}catch(e){errors.push(e.message)}}drawBatch();if(errors.length)alert(errors.join('\n'))}
function drawBatch(){const grid=document.getElementById('batchGrid');if(!grid)return;grid.innerHTML=batchFiles.map((x,i)=>`<div class="batch-item"><img src="${x.image}" alt=""><div class="field"><textarea placeholder="הערה לתמונה (לא חובה)" oninput="batchFiles[${i}].notes=this.value">${esc(x.notes)}</textarea></div><button class="btn" onclick="batchFiles.splice(${i},1);drawBatch()">הסרה</button></div>`).join('');document.getElementById('batchStatus').textContent=batchFiles.length?`${batchFiles.length} תמונות מוכנות להעלאה`: 'עדיין לא נבחרו תמונות';document.getElementById('batchSave').disabled=!batchFiles.length}
async function saveBatch(kind){
 if(!batchFiles.length)return;
 const btn=document.getElementById('batchSave');
 if(!btn||btn.disabled)return;
 btn.disabled=true;btn.textContent='שומר תמונות...';
 const room=document.getElementById('batchRoom')?.value||rooms[0][0];
 let saved=0;
 try{
  for(const f of batchFiles){
   const progressEl=document.getElementById('batchStatus');
   if(progressEl)progressEl.textContent='מעלה תמונה '+(saved+1)+' מתוך '+batchFiles.length+'...';
   let timeoutId;
   try {
    await Promise.race([
     Promise.resolve().then(()=>dbPut({id:'i'+Date.now()+'_'+Math.random().toString(36).slice(2,9),title:'',kind,room,notes:f.notes,url:'',image:f.image,updatedAt:new Date().toISOString()})),
     new Promise((_,reject)=>{timeoutId=setTimeout(()=>reject(new Error('השרת לא השיב בתוך 55 שניות. ייתכן שיש בעיית הרשאות או תקשורת עם Supabase.')),55000)})
    ]);
   } finally {clearTimeout(timeoutId);}
   saved++;
   const status=document.getElementById('batchStatus');
   if(status)status.textContent='נשמרו '+saved+' מתוך '+batchFiles.length+' תמונות';
  }
  batchFiles=[];closeModal();render();showToast(saved+' תמונות נשמרו בהצלחה');
 }catch(err){
  console.error('Image upload failed:',err);
  batchFiles=batchFiles.slice(saved);
  drawBatch();
  const status=document.getElementById('batchStatus');
  if(status)status.textContent='השמירה נכשלה: '+(err.message||'שגיאה לא ידועה')+' · אפשר לנסות שוב';
  showToast('העלאת התמונות נכשלה. הפרטים מופיעים בחלון ההעלאה.',true);
 }finally{
  const current=document.getElementById('batchSave');
  if(current){current.disabled=!batchFiles.length;current.textContent='שמירת כל התמונות'}
 }
}
async function openInspoEditor(id='',kind='inspo'){const item=id?(await dbAll()).find(x=>x.id===id):null;if(!item){openBatchUploader(kind);return}const x=item;kind=x.kind||kind;window.editingInspoImage=x.image||'';document.getElementById('modalRoot').innerHTML=`<div class="modalshade" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>עריכת ${kind==='renders'?'הדמיה':'השראה'}</h2><form onsubmit="saveInspo(event,'${id}','${kind}')"><label class="field">חדר<select name="room">${rooms.map(r=>`<option ${r[0]===x.room?'selected':''}>${esc(r[0])}</option>`).join('')}</select></label><label class="field">הערות<textarea name="notes" rows="3">${esc(x.notes||'')}</textarea></label><label class="field">קישור למקור<input name="url" type="url" value="${esc(x.url||'')}" placeholder="https://..."></label><div class="upload-zone" id="editDrop" ondragover="dragOverMedia(event)" ondragleave="dragLeaveMedia(event)" ondrop="dropEditMedia(event)"><strong>החלפת תמונה — אפשר גם לגרור לכאן</strong><p class="hint">לחצו לבחירת תמונה חלופית או גררו קובץ</p><input type="file" accept="image/jpeg,image/png,image/webp" onchange="previewInspoFile(this)"><div id="inspoPreview">${x.image?`<img class="inspo-preview" src="${x.image}">`:''}</div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">ביטול</button><button type="button" class="btn" onclick="removeInspo('${id}')">מחיקה</button><button class="btn primary" type="submit">שמירת שינויים</button></div></form></div></div>`}
async function dropEditMedia(e){e.preventDefault();e.stopPropagation();e.currentTarget.classList.remove('dragging');if(e.dataTransfer.files.length)await setEditImage(e.dataTransfer.files[0])}
async function previewInspoFile(input){if(input.files[0])await setEditImage(input.files[0])}
async function setEditImage(f){try{const image=await readMediaFile(f);window.editingInspoImage=image;document.getElementById('inspoPreview').innerHTML=`<img class="inspo-preview" src="${image}">`}catch(e){alert(e.message)}}
async function saveInspo(e,id,kind='inspo'){e.preventDefault();const existing=(await dbAll()).find(x=>x.id===id);const form=new FormData(e.target);const obj={...existing,id,title:'',kind,room:String(form.get('room')),notes:String(form.get('notes')),url:String(form.get('url')),image:window.editingInspoImage||'',updatedAt:new Date().toISOString()};try{await dbPut(obj);closeModal();render();showToast('התמונה נשמרה')}catch(err){alert('השמירה נכשלה: '+err.message)}}
async function removeInspo(id){if(!confirm('למחוק את ההשראה?'))return;await dbDelete(id);closeModal();render();showToast('התמונה נמחקה')}
async function importBackup(input){const file=input.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!Array.isArray(obj.works)||!Array.isArray(obj.purchases)||!Array.isArray(obj.decisions))throw Error('מבנה הגיבוי לא תקין');if(!confirm('השחזור יחליף את רשימות השיפוץ הקיימות ואת ספריות ההשראות וההדמיות. להמשיך?'))return;const db=await dbOpen();await new Promise((resolve,reject)=>{const tx=db.transaction('items','readwrite');const store=tx.objectStore('items');store.clear();for(const item of (obj.inspirations||[]))store.put(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});data={works:obj.works,purchases:obj.purchases,decisions:obj.decisions,reserve:obj.reserve??15};localStorage.setItem('renovationV1',JSON.stringify(data));render();alert('הגיבוי שוחזר בהצלחה')}catch(err){alert('לא ניתן לשחזר: '+err.message)}finally{input.value=''}}

let activeReorder=null;
function reorderScope(el){return el.closest('[data-reorder-type]')}
function reorderRow(el){return el.closest('tr.reorder-row')}
function clearReorderUI(){document.querySelectorAll('.reorder-row.dragging,.reorder-row.drop-before,.reorder-row.drop-after').forEach(el=>el.classList.remove('dragging','drop-before','drop-after'));activeReorder=null}
document.addEventListener('dragstart',e=>{
 const handle=e.target.closest?.('.drag-handle');if(!handle)return;
 const row=reorderRow(handle),scope=reorderScope(handle);if(!row||!scope){e.preventDefault();return}
 activeReorder={type:scope.dataset.reorderType,group:scope.dataset.reorderGroup,id:row.dataset.rowId,scope};
 row.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',row.dataset.rowId);e.stopPropagation();
});
document.addEventListener('dragover',e=>{
 if(!activeReorder)return;
 const row=reorderRow(e.target),scope=reorderScope(e.target);
 document.querySelectorAll('.reorder-row.drop-before,.reorder-row.drop-after').forEach(el=>el.classList.remove('drop-before','drop-after'));
 if(!row||!scope||scope!==activeReorder.scope||row.dataset.rowId===activeReorder.id){e.dataTransfer.dropEffect='none';return}
 e.preventDefault();e.dataTransfer.dropEffect='move';
 const before=e.clientY<row.getBoundingClientRect().top+row.getBoundingClientRect().height/2;
 row.classList.add(before?'drop-before':'drop-after');
});
document.addEventListener('drop',e=>{
 if(!activeReorder)return;
 const target=reorderRow(e.target),scope=reorderScope(e.target),state=activeReorder;
 if(!target||!scope||scope!==state.scope||target.dataset.rowId===state.id){clearReorderUI();return}
 e.preventDefault();e.stopPropagation();
 const before=e.clientY<target.getBoundingClientRect().top+target.getBoundingClientRect().height/2;
 const type=state.type,source=data[type],moving=source.find(x=>String(x.id)===state.id),destination=source.find(x=>String(x.id)===target.dataset.rowId);
 if(!moving||!destination||(type!=='decisions'&&moving.room!==destination.room)){clearReorderUI();return}
 // Reorder the complete backing array, even if the view is filtered.
 const without=source.filter(x=>x!==moving),idx=without.indexOf(destination);
 without.splice(idx+(before?0:1),0,moving);data[type]=without;
 clearReorderUI();save();showToast('סדר השורות עודכן');
});
document.addEventListener('dragend',clearReorderUI);

function translateText(text){if(siteLanguage!=='ru')return text;const trimmed=text.trim();if(!trimmed)return text;let out=russianUI[trimmed];if(!out && trimmed.startsWith('ספריית '))out=russianUI[trimmed.slice(7)]==='Визуализации'?'Галерея визуализаций':russianUI[trimmed.slice(7)]==='Идеи'?'Галерея идей':undefined;if(!out){const m=trimmed.match(/^(\\d+) (עבודות|חדרים|תמונות|רכישות)$/);if(m)out=m[1]+' '+({עבודות:'работ',חדרים:'комнат',תמונות:'изображений',רכישות:'покупок'}[m[2]])}return out?text.replace(trimmed,out):text}
function translateDOM(root){if(siteLanguage!=='ru'||!root)return;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=walker.nextNode()){if(n.parentElement?.closest('script,style,textarea,option[data-user]'))continue;const t=translateText(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t}root.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(e=>{const t=translateText(e.placeholder);if(t!==e.placeholder)e.placeholder=t});root.querySelectorAll('[title],[aria-label]').forEach(e=>{for(const a of ['title','aria-label'])if(e.hasAttribute(a))e.setAttribute(a,translateText(e.getAttribute(a)))})}

function setSiteLanguage(lang){siteLanguage=lang==='ru'?'ru':'he';localStorage.setItem('beitSiteLanguage',siteLanguage);render();applyLanguage()}
const ruObserver=new MutationObserver(changes=>{if(siteLanguage!=='ru')return;for(const c of changes){for(const node of c.addedNodes){if(node.nodeType===1)translateDOM(node);else if(node.nodeType===3){const changed=translateText(node.nodeValue);if(changed!==node.nodeValue)node.nodeValue=changed}}}});ruObserver.observe(document.body,{childList:true,subtree:true});

.value);item.textContent=opt.textContent;item.disabled=opt.disabled;item.setAttribute('role','option');item.setAttribute('aria-selected',String(opt.selected));item.addEventListener('click',ev=>{ev.stopPropagation();sel.selectedIndex=i;sel.dispatchEvent(new Event('change',{bubbles:true}));sync();close();button.focus()});menu.append(item)});document.body.append(menu);const box=button.getBoundingClientRect();const w=Math.max(160,box.width),h=Math.min(270,menu.scrollHeight);menu.style.width=w+'px';menu.style.left=Math.max(8,Math.min(innerWidth-w-8,box.left))+'px';menu.style.top=(box.bottom+h+8>innerHeight?Math.max(8,box.top-h-6):box.bottom+6)+'px';wrap.classList.add('open');button.setAttribute('aria-expanded','true');open={wrap,button,menu}});button.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();if(!open)button.click();open?.menu.querySelector('[aria-selected="true"]')?.focus()}});sel.addEventListener('change',sync);new MutationObserver(sync).observe(sel,{attributes:true,childList:true,subtree:true});sync()}function scan(node){if(node.nodeType!==1)return;if(node.matches?.('select'))enhance(node);node.querySelectorAll?.('select').forEach(enhance)}document.addEventListener('click',e=>{if(open&&!open.wrap.contains(e.target)&&!open.menu.contains(e.target))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(open&&(e.key==='ArrowDown'||e.key==='ArrowUp')){const a=Array.from(open.menu.querySelectorAll('button:not(:disabled)'));const i=a.indexOf(document.activeElement);if(i>=0){e.preventDefault();a[(i+(e.key==='ArrowDown'?1:-1)+a.length)%a.length]?.focus()}}});window.addEventListener('scroll',close,true);window.addEventListener('resize',close);scan(document.body);new MutationObserver(rs=>{for(const r of rs)for(const n of r.addedNodes)scan(n)}).observe(document.body,{childList:true,subtree:true})})();</script></body></html>
